version: "3.9"

services:
  # ── LiveKit Server (self-hosted) ──
  livekit-server:
    image: livekit/livekit-server:latest
    command: --dev  # dev mode generates keys automatically
    ports:
      - "7880:7880"   # HTTP / WebSocket
      - "7881:7881"   # RTC (WebRTC)
    environment:
      - LIVEKIT_KEYS=devkey: secret

  # ── RAG Backend API ──
  rag-backend:
    build:
      context: .
      dockerfile: voice_agent/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - voice_agent/.env
    volumes:
      - ./data:/app/data
      - ./vector_db:/app/vector_db
    depends_on:
      - livekit-server

  # ── Voice Agent ──
  voice-agent:
    build:
      context: .
      dockerfile: voice_agent/Dockerfile.agent
    env_file:
      - voice_agent/.env
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      - TEXT_BACKEND_URL=http://rag-backend:8000
    depends_on:
      - livekit-server
      - rag-backend
